# Configuración para ejecución autónoma de pruebas unitarias con H2 en memoria
spring.application.name=prisma-backend-test
spring.datasource.url=jdbc:h2:mem:prisma_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

prisma.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
prisma.jwt.expiration-ms=604800000

springdoc.api-docs.enabled=false
management.endpoints.enabled-by-default=false
