# Perfil local dev con base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:prisma_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.jackson.serialization.fail-on-empty-beans=false
logging.level.org.springframework.security=DEBUG
# Cookie de refresh sin flag Secure para pruebas locales sobre http
prisma.jwt.refresh-cookie-secure=false
# HU-12: llave de cifrado SOLO para desarrollo local y redirect al frontend local (Vite)
prisma.pagos.encryption-key=${PAGOS_ENCRYPTION_KEY:je1xenj1GPr2pgRX2VSB4+dKk7oKLqeg4Z4J+YG/Bj0=}
prisma.pagos.mercadopago.redirect-uri=${MP_REDIRECT_URI:http://localhost:5173/proveedor/pagos/callback}
