# ==============================================================================
# PRISMA - Configuración de la API REST (Spring Boot 3.3.4 / Java 21)
# ==============================================================================

spring.application.name=prisma-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# Conexión a Base de Datos PostgreSQL (Local Docker o Cloud Neon/Supabase)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lucky-forest-bel5wb6j.c-9.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_uxeh8qU3oNzS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración HikariCP Connection Pool (Optimizado para Free Tier $0)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=PrismaHikariPool

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Jackson JSON Serialization
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# Seguridad y JWT (JSON Web Token)
# ------------------------------------------------------------------------------
# Clave HMAC-SHA256 de al menos 256 bits (32 bytes)
prisma.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Duración del Token: 7 días (604800000 ms) para evitar deslogueos al tendero
prisma.jwt.expiration-ms=604800000
# Refresh token (HU-03): 30 días en cookie HttpOnly, solo enviada a /api/v1/auth
prisma.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
prisma.jwt.refresh-cookie-secure=${JWT_COOKIE_SECURE:true}
# Clave AES-256 Base64 para cifrar secretos TOTP (32 bytes). Generar en prod con: openssl rand -base64 32
prisma.totp.encryption-key=${TOTP_ENCRYPTION_KEY:2yq4qLEOXotnu8xfOD5F/YCc2fEykhP5llcaF0YWDOs=}

# Control de Orígenes CORS (Seguridad: solo Vercel y desarrollo local)
prisma.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://prisma-frontend-web.vercel.app}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI 3 Documentation UI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------------------------------------------------------------
# Actuator (Health Checks y Métricas $0)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ------------------------------------------------------------------------------
# Carga de Archivos (Logos y Comprobantes)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# HU-12 / HU-13: Pasarela de pagos SIMULADA (Wompi sandbox, sin cobros reales)
# ------------------------------------------------------------------------------
# Secreto con el que se firman y validan los webhooks (checksum SHA-256). Valor de pruebas.
prisma.pagos.wompi.events-secret=${WOMPI_EVENTS_SECRET:test_events_prisma_simulado}

# ------------------------------------------------------------------------------
# HU-19: Circuit breaker (Resilience4j) ante caída de la pasarela de pagos
# ------------------------------------------------------------------------------
# Se abre si, en las últimas N llamadas (mínimo M), el % de fallos alcanza el umbral
prisma.pagos.circuit-breaker.ventana-llamadas=${PAGOS_CB_VENTANA:10}
prisma.pagos.circuit-breaker.minimo-llamadas=${PAGOS_CB_MINIMO:5}
prisma.pagos.circuit-breaker.umbral-fallos-porcentaje=${PAGOS_CB_UMBRAL:50}
# Tiempo abierto antes de pasar a semiabierto (half-open) y llamadas de prueba para cerrarlo
prisma.pagos.circuit-breaker.espera-abierto-segundos=${PAGOS_CB_ESPERA_SEG:30}
prisma.pagos.circuit-breaker.llamadas-prueba-semiabierto=${PAGOS_CB_PRUEBAS:2}
# Cuánto tarda la pasarela simulada en "fallar" con el Nequi de caída 3993333333 (imita un timeout)
prisma.pagos.simulacion.demora-falla-ms=2000
