version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisma_db
      POSTGRES_USER: prisma_user
      POSTGRES_PASSWORD: prisma_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma_user -d prisma_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prisma-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/prisma_db
      DB_USER: prisma_user
      DB_PASSWORD: prisma_password_2026
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      PORT: 8080

volumes:
  postgres_data:
