# ==============================================================================
# PRISMA - Microservicio de Autenticación e Identidad (Puerto 8081)
# ==============================================================================

spring.application.name=auth-service
server.port=${PORT:8081}
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# Conexión PostgreSQL (Base de datos compartida o esquema 'auth')
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prisma_db}
spring.datasource.username=${DB_USER:prisma_user}
spring.datasource.password=${DB_PASSWORD:prisma_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=PrismaAuthHikariPool

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Seguridad y JWT (Firma compartida con el resto de microservicios)
# ------------------------------------------------------------------------------
prisma.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 7 días de duración
prisma.jwt.expiration-ms=604800000

# ------------------------------------------------------------------------------
# Swagger / OpenAPI 3
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------------------------------------------------
# Actuator
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
