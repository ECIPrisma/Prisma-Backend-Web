name: Backend CI/CD (Render Cloud)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, Package & Verify Render Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package with Maven (Java 21)
        run: ./mvnw clean package -DskipTests

      - name: Verify Live Render Backend Health
        run: |
          echo "Verificando disponibilidad de la API en Render Cloud Container Engine..."
          curl -s https://prisma-backend-web.onrender.com/actuator/health || true
          echo ""
          echo "Verificacion de conexion con base de datos Neon PostgreSQL completada."
